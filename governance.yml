# Central governance config: the single declaration of this repo's gate list,
# tool versions, and review authority. It is a CONTRACT ANCHOR, not a runtime
# source or generator — nothing reads it at run time. The contract tests
# (governance/tests/test_governance_config.py) pin the workflows, the ruleset,
# pyproject.toml, and CLAUDE.md to these values, so a value here and the file
# it mirrors must change together or the test fails.
schema_version: 1

runtime:
  python_version: "3.10"

toolchain:
  ruff_version: "0.15.21"
  pyright_version: "1.1.408"

review:
  approving_authority: zero-bang

slice:
  label: slice
  issue_template: .github/ISSUE_TEMPLATE/slice.yml

ruleset:
  name: Protect-Main
  # The gated laws in CLAUDE.md must be in exact bijection with this list, and
  # this list with the live ruleset. pr_checks_honesty proves the first,
  # pr_checks_ruleset the second.
  #
  # Everything from `PR Checks Tests` down is this repository's own and has no
  # upstream counterpart: the suite and its coverage floor and runtime budget,
  # the docs-site build on this repo's own generator, packaging verification,
  # and the built-wheel install matrix.
  required_status_checks:
    - PR Checks CodeQL (python)
    - pr_checks_cc
    - pr_checks_lint
    - pr_checks_ruleset
    - pr_checks_slice
    - pr_checks_fail_loud
    - pr_checks_typing
    - pr_checks_version
    - pr_checks_honesty
    - PR Checks Tests
    - PR Checks Coverage
    - PR Checks Runtime
    - PR Checks Docs Site
    - PR Checks Packaging
    - PR Checks Package Install (3.10)
    - PR Checks Package Install (3.11)
    - PR Checks Package Install (3.12)
    - PR Checks Package Install (3.13)
