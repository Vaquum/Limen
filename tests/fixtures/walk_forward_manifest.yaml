schema_version: "1.0"

metadata:
  name: recorded_walk_forward
  limen_version: "5.21.0"
  mode: development
  description: Two recorded hourly folds with independent execution

sfd:
  manifest:
    type: rule_based
    data_source:
      method: limen.data.HistoricalData.get_spot_klines
      params:
        kline_size: 3600
    split_walk_forward:
      n_folds: 2
      test_bars: 48
      purge_bars: 4
      embargo_bars: 3
      anchored: true
    indicators:
      - func: limen.indicators.window_return
        params:
          period: 1
    strategy:
      conditions:
        - id: entry
          name: positive_return
          type: threshold
          column: ret_1
          operator: ">"
          value: "{entry_return}"
      entry: entry
    backtest:
      fee_bps: 7.0
      slip_bps: 3.0
      notional_rate: 0.5
    reference_architecture: limen.sfd.reference_architecture.rule_based
  params:
    entry_return: [0.0, 0.001]

uel:
  n_permutations: 2
  search_strategy:
    type: grid
  checkpoint_interval: 1
  prep_each_round: true
  output_format: csv
