schema_version: '1.0'
metadata:
  name: entropy_var_experiment
  limen_version: '5.46.2'
  mode: development
  description: Signed lower return quantile from raw completed return-sign entropy
sfd:
  manifest:
    type: ml
    data_source:
      method: limen.data.HistoricalData.get_spot_klines
      params:
        kline_size: 3600
    split_dates:
      train_start: '2024-01-01'
      train_end: '2024-01-22'
      val_start: '2024-01-22'
      val_end: '2024-01-26'
      test_start: '2024-01-26'
      test_end: '2024-02-01'
    indicators:
    - func: limen.indicators.window_return
      params:
        period: 1
    features:
    - func: limen.features.lag_range
      params:
        col: ret_1
        start: 0
        end: lookback_end
    target:
      name: next_return
      class: limen.targets.NextReturnTarget
      transform_params:
        periods: horizon
        scale: 100.0
    strict_mode: true
    reference_architecture: limen.sfd.reference_architecture.entropy_var_regressor
  params:
    lookback_end: [23, 47]
    horizon: [24]
    quantile: [0.01, 0.05]
    alpha: [0.0]
    fit_intercept: [true]
    solver: [highs]
    solver_options: [null]
uel:
  n_permutations: 4
  search_strategy:
    type: grid
  prep_each_round: true
  output_format: csv
