schema_version: '1.0'

metadata:
  name: residual_regressor_experiment
  limen_version: 5.46.2
  mode: development
  description: Ridge plus an observed-residual XGBoost correction

sfd:
  manifest:
    type: ml

    data_source:
      method: limen.data.HistoricalData.get_spot_klines
      params:
        kline_size: 3600

    split_dates:
      train_start: '2024-01-01'
      train_end: '2024-01-15'
      val_start: '2024-01-15'
      val_end: '2024-01-18'
      test_start: '2024-01-18'
      test_end: '2024-01-22'

    indicators:
    - func: limen.indicators.window_return
      params:
        period: 1

    features:
    - func: limen.features.lag_range
      params:
        col: ret_1
        start: 1
        end: 5

    target:
      name: next_return
      class: limen.targets.NextReturnTarget
      transform_params:
        periods: 1
        scale: 100.0

    scaler:
      class: limen.scalers.RobustScaler

    strict_mode: true

    reference_architecture: limen.sfd.reference_architecture.residual_regressor

  params:
    ridge_params:
    - alpha: 0.1
      solver: svd
    - alpha: 1.0
      solver: svd
    xgboost_params:
    - n_estimators: 32
    - n_estimators: 64
    correction_scale:
    - 0.5
    - 1.0

uel:
  n_permutations: 8
  search_strategy:
    type: random
  prep_each_round: true
  output_format: csv
