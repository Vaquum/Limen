schema_version: "1.0"

metadata:
  name: tabpfn_binary_experiment
  limen_version: "5.8.1"
  mode: development
  description: TabPFN binary classifier with calibration, feature ablation, and explicit scaler

sfd:
  manifest:
    type: ml

    data_source:
      method: limen.data.HistoricalData.get_spot_klines
      params:
        kline_size: 3600

    split_dates:
      train_start: "2024-01-01"
      train_end:   "2024-09-30"
      val_start:   "2024-10-01"
      val_end:     "2024-11-30"
      test_start:  "2024-12-01"
      test_end:    "2024-12-31"

    indicators:
      - func: limen.indicators.roc
        params:
          period: 1
          group: momentum
      - func: limen.indicators.roc
        params:
          period: 4
          group: momentum
      - func: limen.indicators.roc
        params:
          period: 12
          group: momentum
      - func: limen.indicators.rolling_volatility
        params:
          column: close
          window: 12
          group: volatility
      - func: limen.indicators.wilder_rsi
        params:
          period: "{rsi_period}"
          group: momentum
      - func: limen.indicators.bollinger_bands
        params:
          price_col: close
          window: "{bb_window}"
          num_std: "{bb_std}"
          group: volatility
      - func: limen.indicators.bollinger_position
        params:
          group: volatility

    features:
      - func: limen.features.fractional_diff
        params:
          d: 0.5
          cols:
            - close

    target:
      name: forward_breakout
      class: limen.targets.ForwardBreakoutTarget
      transform_params:
        forward_periods: "{forward_periods}"
        threshold: "{threshold_pct}"
        shift: -1

    scaler:
      class: limen.scalers.RobustScaler

    feature_ablation:
      drop_count_key: feature_drop_count
      seed_key: feature_drop_seed

    strict_mode: true

    reference_architecture: limen.sfd.reference_architecture.tabpfn_binary.tabpfn_binary

    calibration:
      probability_calibration:
        func: limen.calibration.sklearn_probability_calibrator
        params:
          method: "{cal_method}"
      threshold_function:
        func: limen.calibration.grid_threshold_optimizer
        params:
          metric: limen.metrics.balanced_metric.balanced_metric
          threshold_min: "{threshold_min}"
          threshold_max: "{threshold_max}"
          threshold_step: "{threshold_step}"

  params:
    # target
    forward_periods: [4, 8]
    threshold_pct: [0.01, 0.02]
    # indicators
    rsi_period: [14]
    bb_window: [20]
    bb_std: [2.0]
    # feature perturbation
    feature_groups: [all, "momentum|volatility"]
    feature_drop_count: [0]
    feature_drop_seed: [42]
    # calibration
    use_calibration: [true]
    use_threshold: [true, false]
    cal_method: [sigmoid]
    threshold_min: [0.25]
    threshold_max: [0.65]
    threshold_step: [0.05]
    # model
    n_ensemble_configurations: [4, 8]
    device: [cpu]

uel:
  n_permutations: 12
  search_strategy:
    type: random
  prep_each_round: true
  output_format: csv
