name: Docs Site Checks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr_checks_docs_site:
    name: PR Checks Docs Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'

      - name: Install recorded research environment
        run: |
          python -m pip install --require-hashes -r docs/examples/requirements-quality.txt
          python -m pip install --require-hashes -r requirements/ci/research-env.txt
          python -m pip install --no-deps -e .

      - name: Check documentation Python
        run: python docs/examples/check_sources.py

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: npm ci

      - name: Check bindings without prior execution evidence
        run: python -m pytest --import-mode=importlib docs/examples/tests/test_docs_examples.py -k 'not exact_bindings_and_coverage' -q --docs-evidence .docs-evidence/bindings-only.json

      - name: Prove retained checker selection and failure receipts
        run: timeout 60s python -m pytest --import-mode=importlib docs/checker/tests -q

      - name: Prepare hashed offline research dependencies
        run: python docs/examples/prepare_environment.py

      - name: Acquire merged source identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: python docs/examples/retained_checker.py docs/examples/provenance.py --output .docs-evidence/source-provenance.json

      - name: Prove the candidate wheel and research projects
        env:
          LIMEN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: timeout 300s python docs/examples/retained_checker.py -m pytest --import-mode=importlib docs/examples/tests -q -x --tb=short --durations=15

      - name: Install the matching reader evidence checker
        run: python docs/examples/retained_checker.py --install-launcher .docs-evidence/retained-python

      - name: Prove dependency audit failures
        working-directory: docs-site
        run: node --test tests/audit.spec.mjs

      - name: Audit docs-site dependencies
        working-directory: docs-site
        run: npm run security:audit

      - name: Lint and build the research book
        working-directory: docs-site
        env:
          LIMEN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LIMEN_PYTHON: ${{ github.workspace }}/.docs-evidence/retained-python
        run: timeout 60s npm run check

      - name: Provision the locked browser
        working-directory: docs-site
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npx --no-install playwright install --with-deps chromium webkit

      - name: Prove the reading experience
        working-directory: docs-site
        env:
          LIMEN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:reader -- --evidence ../.docs-evidence/current.json --head "$LIMEN_EXPECTED_HEAD" --tested "$(git rev-parse HEAD)" --tree "$(git rev-parse HEAD^{tree})"

      - name: Set up the isolated deployment toolchain runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs-site/publisher/package-lock.json

      - name: Install and audit the pinned deployment toolchain
        working-directory: docs-site/publisher
        run: |
          npm ci
          npm run security:audit
          npm run check:assets
          npm run check:config
          node node_modules/wrangler/bin/wrangler.js deploy --config ../editor/wrangler.json --dry-run --outdir ../.wrangler/editor-check

      - name: Retain research and browser evidence
        if: ${{ always() && hashFiles('.docs-evidence/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-book-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .docs-evidence/
            !.docs-evidence/wheelhouse/**
