name: Docs Site Checks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr_checks_docs_site:
    name: PR Checks Docs Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install recorded research environment
        run: |
          python -m pip install --require-hashes -r docs/examples/requirements-quality.txt
          python -m pip install --require-hashes -r requirements/ci/research-env.txt
          python -m pip install --no-deps -e .

      - name: Check documentation Python
        run: python docs/examples/check_sources.py

      - name: Prepare hashed offline research dependencies
        run: python docs/examples/prepare_environment.py

      - name: Acquire merged source identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: python docs/examples/provenance.py --output .docs-evidence/source-provenance.json

      - name: Prove the candidate wheel and research projects
        env:
          LIMEN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: timeout 120s python -m pytest --import-mode=importlib docs/examples/tests -q -x --tb=short

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        working-directory: docs-site
        run: npm ci

      - name: Prove dependency audit failures
        working-directory: docs-site
        run: node --test tests/audit.spec.mjs

      - name: Audit docs-site dependencies
        working-directory: docs-site
        run: npm run security:audit

      - name: Build docs site
        working-directory: docs-site
        run: npm run check

      - name: Assemble the candidate reader
        working-directory: docs-site
        env:
          LIMEN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: timeout 60s npm run build:reader

      - name: Provision the locked browser
        working-directory: docs-site
        run: npx --no-install playwright install --with-deps chromium

      - name: Prove the reading experience
        working-directory: docs-site
        env:
          LIMEN_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run check:reader

      - name: Retain research and browser evidence
        if: ${{ always() && hashFiles('.docs-evidence/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-book-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .docs-evidence/
            !.docs-evidence/wheelhouse/**
