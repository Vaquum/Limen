name: pr_checks_slice_sweep

# Re-run the slice gate for every open PR targeting main on a fixed
# cadence and repost each PR's `pr_checks_slice` check-run on its head
# commit.
#
# Why: `pr_checks_slice` runs on pull_request activity and caches its
# verdict; `pr_checks_slice_on_issue` reposts it when a linked issue
# changes. If that on-issue rerun crashes before posting, a stale green
# verdict persists until the PR's next own event. This sweep bounds the
# staleness window: a stale verdict now survives at most one sweep
# interval. The sweep is a backstop, not a single point of failure --
# the pull_request-event gate still runs on every PR update.
#
# The gate here executes from a checkout of main, never from a PR's
# merge ref, so a sweep verdict cannot be self-attested by the PR it
# judges.
#
# GitHub branch protection does not treat the most recent check-run
# per name as authoritative: once an API-posted check-run exists on a
# head SHA it outranks the workflow-run entries of the same name, and
# only a newer API-posted check-run supersedes it (observed on
# PR #757). A failure posted here blocks merge immediately, and a
# stale API-posted verdict must be reposted -- rerunning the canonical
# run alone never clears it.
#
# Named in Limen's governance hardening slice (S691); the fail-closed
# rerun contract mirrors pr_checks_slice_on_issue.yml.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  # No cancel-in-progress: killing a sweep mid-posting would leave some
  # PRs reposted and others stale for a full extra interval. A queued
  # run simply follows.
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep_slice_gate_for_open_prs:
    name: pr_checks_slice_sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: write  # required to POST fallback check-runs
      actions: write  # required to rerun the canonical pr_checks_slice run

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Pin to main so a workflow_dispatch from another ref still
          # executes the gate from main's tree, keeping the
          # main-only execution contract mechanical.
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install --require-hashes -r requirements/ci/gate-tools.txt

      - name: List open PRs targeting main
        id: open_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          gh pr list --repo "$REPO" --base main --state open --limit 1000 \
            --json number,headRefOid > open_prs.json
          echo "open PRs targeting main:"
          jq -c '.[]' open_prs.json
          COUNT=$(jq 'length' open_prs.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Re-run slice gate per open PR and post check-run
        if: steps.open_prs.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          jq -c '.[]' open_prs.json | while read pr; do
            PR_NUM=$(echo "$pr" | jq -r .number)
            HEAD_SHA=$(echo "$pr" | jq -r .headRefOid)
            echo "::group::re-running slice gate for PR #$PR_NUM @ $HEAD_SHA"

            # Title + body + canonical file count; files come from the
            # paginated REST endpoint, not `gh pr view --json files`
            # (which caps at 100 and would silently under-enforce
            # rules 7 and 8 on large PRs).
            gh pr view "$PR_NUM" --repo "$REPO" \
              --json title,body,changedFiles > pr_view.json
            jq -r '.title' pr_view.json > pr_title.txt
            jq -r '.body // ""' pr_view.json > pr_body.txt
            EXPECTED_FILES=$(jq -r '.changedFiles' pr_view.json)

            gh api "repos/$REPO/pulls/$PR_NUM/files" \
              --paginate --jq '.[].filename' > pr_files.txt
            ACTUAL_FILES=$(wc -l < pr_files.txt | tr -d ' ')

            if [ "$ACTUAL_FILES" -ne "$EXPECTED_FILES" ]; then
              # Post a FAILURE check-run immediately rather than
              # silently proceeding with a truncated file set -- the
              # same fail-closed contract as the on-issue rerun.
              gh api "repos/$REPO/check-runs" \
                --method POST \
                -f "name=pr_checks_slice" \
                -f "head_sha=$HEAD_SHA" \
                -f "status=completed" \
                -f "conclusion=failure" \
                -f "output[title]=Slice gate sweep ABORTED: file enumeration incomplete" \
                -f "output[summary]=pr_checks_slice_sweep got $ACTUAL_FILES files from the paginated API but the PR object reports $EXPECTED_FILES. The sweep refuses to run a scope check on a truncated set." \
                -f "details_url=https://github.com/$REPO/actions/runs/${{ github.run_id }}"
              echo "::endgroup::"
              continue
            fi

            # Run the slice gate; capture output and exit code.
            PR_TITLE=$(cat pr_title.txt)
            set +e
            GATE_OUT=$(python governance/slice_gate.py \
              --pr-title "$PR_TITLE" \
              --pr-body-file pr_body.txt \
              --pr-files-file pr_files.txt \
              --template .github/ISSUE_TEMPLATE/slice.yml \
              --repo "$REPO" 2>&1)
            GATE_EXIT=$?
            set -e
            echo "$GATE_OUT"

            if [ "$GATE_EXIT" -eq 0 ]; then
              CONCLUSION="success"
              TITLE_OUT="Slice gate re-passed by scheduled sweep"
            else
              CONCLUSION="failure"
              TITLE_OUT="Slice gate FAILED in scheduled sweep"
            fi

            # Rerun-first delivery with API-posted reconciliation
            # (S724, S760): the pull_request-event run is the
            # canonical checks-UI entry and a workflow run's conclusion
            # is immutable unless rerun, so a canonical run that
            # disagrees with the fresh verdict is healed by rerun. An
            # API-posted check-run is immutable too, and branch
            # protection keeps honouring it even after a later
            # canonical run lands the opposite verdict (PR #757), so a
            # fresh POST of the same name is its only supersession.
            # Delivery reconciles both surfaces: rerun the canonical
            # run when it disagrees, POST when the latest API-posted
            # check-run disagrees, and POST fail-closed when neither
            # surface carries a verdict at all. Check-runs inside the
            # check suites of pr_checks_slice.yml's own workflow runs
            # are job-backed; every other completed check-run of the
            # name is an API-posted fallback.
            RUNS=$(gh api \
              "repos/$REPO/actions/workflows/pr_checks_slice.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq '.workflow_runs')
            SUITES=$(echo "$RUNS" | jq '[.[].check_suite_id]')
            CANONICAL=$(echo "$RUNS" | jq -c \
              '[.[] | select(.event == "pull_request" and .status == "completed")][0] // empty')
            gh api \
              "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=pr_checks_slice&per_page=100&filter=all" \
              --paginate --jq '.check_runs[]' > check_runs.jsonl
            LATEST_POSTED=$(jq -rs --argjson suites "$SUITES" \
              '[.[] | select(.status == "completed")
                    | .check_suite.id as $s | select(($suites | index($s)) == null)]
               | sort_by(.completed_at) | last | .conclusion // empty' check_runs.jsonl)

            DELIVER=""
            if [ -n "$LATEST_POSTED" ] && [ "$LATEST_POSTED" != "$CONCLUSION" ]; then
              DELIVER="latest API-posted check-run is $LATEST_POSTED; superseding"
            fi
            if [ -n "$CANONICAL" ]; then
              RUN_ID=$(echo "$CANONICAL" | jq -r .id)
              RUN_CONCLUSION=$(echo "$CANONICAL" | jq -r .conclusion)
              if [ "$RUN_CONCLUSION" != "$CONCLUSION" ]; then
                if gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/rerun" > /dev/null; then
                  echo "canonical run $RUN_ID rerun requested ($RUN_CONCLUSION -> expected $CONCLUSION)"
                else
                  DELIVER="rerun of canonical run $RUN_ID failed; falling back to check-run POST"
                fi
              else
                echo "canonical run $RUN_ID already $CONCLUSION"
              fi
            elif [ -z "$LATEST_POSTED" ]; then
              DELIVER="no completed canonical run and no API-posted check-run for $HEAD_SHA; posting fail-closed"
            fi
            if [ -z "$DELIVER" ]; then
              echo "verdict $CONCLUSION already delivered for $HEAD_SHA; nothing to post"
              echo "::endgroup::"
              continue
            fi
            echo "$DELIVER"

            # Keep output.summary under the 65 KB API limit. Truncation
            # uses a parameter expansion, not a pipe: with pipefail, a
            # `printf | head -c` pipeline dies by SIGPIPE exactly when
            # output is long enough to truncate, aborting the sweep.
            SUMMARY=$(printf 'Posted by pr_checks_slice_sweep run %s.\n\n```\n%s\n```\n' \
              "${{ github.run_id }}" "$GATE_OUT")
            SUMMARY=${SUMMARY:0:60000}

            # Same check-run name as the pull_request workflow, so
            # branch protection sees this as the current status of
            # `pr_checks_slice` on that head SHA.
            gh api "repos/$REPO/check-runs" \
              --method POST \
              -f "name=pr_checks_slice" \
              -f "head_sha=$HEAD_SHA" \
              -f "status=completed" \
              -f "conclusion=$CONCLUSION" \
              -f "output[title]=$TITLE_OUT" \
              -f "output[summary]=$SUMMARY" \
              -f "details_url=https://github.com/$REPO/actions/runs/${{ github.run_id }}"
            echo "::endgroup::"
          done
