name: Pyright Type Check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr_checks_pyright:
    name: PR Checks Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      - run: |
          pip install --require-hashes -r requirements/ci/dev-env.txt
          pip install --no-deps -e .
      - run: pyright --outputjson > pyright_output.json || true
      - env:
          PYRIGHT_WARNING_BASELINE: 0
        run: |
          python - <<'EOF'
          import json
          import os
          import sys
          from pathlib import Path

          summary = json.loads(Path('pyright_output.json').read_text())['summary']
          baseline = int(os.environ['PYRIGHT_WARNING_BASELINE'])
          print(f"errors={summary['errorCount']} warnings={summary['warningCount']} baseline={baseline}")
          sys.exit(1 if summary['errorCount'] > 0 or summary['warningCount'] > baseline else 0)
          EOF
