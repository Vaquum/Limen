name: Publish Research Book

on:
  workflow_dispatch:
    inputs:
      package_publish_run:
        description: 'Successful canonical Publish Package to PyPI run to prove and publish'
        required: true
        type: string
  workflow_run:
    workflows: ['Publish Package to PyPI']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: limen-released-documentation
  cancel-in-progress: false

jobs:
  publish:
    name: Prove and Publish Released Documentation
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: documentation
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Checkout the trusted publication tools
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify the triggering publishing workflow
        env:
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || inputs.package_publish_run }}
        run: |
          gh api "repos/Vaquum/Limen/actions/runs/$PUBLISH_RUN_ID" > /tmp/package-publish-run.json
          python - <<'PY'
          import json, os
          run = json.load(open('/tmp/package-publish-run.json'))
          if (run['id'] != int(os.environ['PUBLISH_RUN_ID']) or run['conclusion'] != 'success'
              or run['path'] != '.github/workflows/pr_publish_pypi.yml'
              or run['head_repository']['full_name'] != 'Vaquum/Limen'):
              raise SystemExit('Only the successful canonical package-publishing run can publish documentation')
          PY

      - name: Retain the trusted provider asset adapter
        run: cp docs-site/publisher/prepare-assets.mjs "$RUNNER_TEMP/limen-prepare-assets.mjs"

      - name: Download that exact run's published-package identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: released-docs-identity
          path: .docs-evidence/package-publication
          run-id: ${{ github.event.workflow_run.id || inputs.package_publish_run }}
          github-token: ${{ github.token }}

      - name: Set up the policy-pinned research interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Resolve the merged release tag
        id: release
        env:
          PUBLISH_RUN_ID: ${{ github.event.workflow_run.id || inputs.package_publish_run }}
        run: python docs/examples/release_identity.py read --receipt .docs-evidence/package-publication/identity.json --run-id "$PUBLISH_RUN_ID" --github-output "$GITHUB_OUTPUT"

      - name: Checkout the exact published source
        env:
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: git checkout --detach "$RELEASE_COMMIT"

      - name: Set up the publisher's required Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            docs-site/publisher/package-lock.json

      - name: Install and audit both complete dependency graphs
        run: |
          npm ci --prefix docs-site
          npm ci --prefix docs-site/publisher
          npm --prefix docs-site run security:audit
          npm --prefix docs-site/publisher run security:audit

      - name: Install the pinned research and proof tools
        run: |
          python -m pip install --require-hashes -r docs/examples/requirements-quality.txt
          python -m pip install --require-hashes -r requirements/ci/research-env.txt
          python -m pip install --no-deps -e .
          python docs/examples/check_sources.py
          python docs/examples/prepare_environment.py

      - name: Download the actual public PyPI wheel
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python docs/examples/released_wheel.py --version "$RELEASE_VERSION" --output .docs-evidence
          python docs/examples/release_identity.py wheel --identity .docs-evidence/package-publication/identity.json --receipt .docs-evidence/released-wheel.json

      - name: Retain and anonymously download the pinned project and input bundle
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release }}
        run: python docs/examples/release_assets.py bundle --release "$RELEASE_TAG"

      - name: Acquire merged source and PR identities
        run: python docs/examples/provenance.py --output .docs-evidence/source-provenance.json

      - name: Execute the downloaded projects against the released wheel
        run: timeout 240s python -m pytest --import-mode=importlib docs/examples/tests -q -x --tb=short --released-wheel .docs-evidence/released-wheel.json --released-bundle .docs-evidence/released-examples.tar.gz

      - name: Build and verify the released reader
        working-directory: docs-site
        run: |
          npm run check
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          npx --no-install playwright install --with-deps chromium webkit
          npm run check:reader

      - name: Seal and retain the public release evidence
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release }}
        run: |
          python docs/examples/publication.py --release "$RELEASE_TAG"
          python docs/examples/release_assets.py publication --release "$RELEASE_TAG"
          node "$RUNNER_TEMP/limen-prepare-assets.mjs" docs-site/reader-build

      - name: Upload and anonymously verify an inactive Worker version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DOCS_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          python docs/examples/deploy_publication.py stage --release "$RELEASE_TAG" --wrangler docs-site/publisher/node_modules/.bin/wrangler

      - name: Activate the verified version and prove production or restore its predecessor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DOCS_API_TOKEN }}
        run: python docs/examples/deploy_publication.py activate --wrangler docs-site/publisher/node_modules/.bin/wrangler

      - name: Retain execution, preview, activation and rollback diagnostics
        if: ${{ always() && hashFiles('.docs-evidence/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: released-research-book-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .docs-evidence/
            !.docs-evidence/wheelhouse/**
