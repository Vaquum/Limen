name: Publish Package to PyPI

on:
  release:
    types: [published]
  workflow_run:
    workflows: ['Automated Release']
    types: [completed]

jobs:
  resolve_release_tag:
    name: Resolve Release Tag
    if: |
      github.event_name == 'release' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.resolve.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout release commit from workflow run
        if: github.event_name == 'workflow_run'
        run: git checkout --force "${{ github.event.workflow_run.head_sha }}"

      - name: Fetch all tags
        run: git fetch --force --tags origin

      - name: Resolve released tag
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == 'release' ]]; then
            tag_name='${{ github.event.release.tag_name }}'
          else
            head_sha='${{ github.event.workflow_run.head_sha }}'
            tag_name="$(git tag --points-at "$head_sha" | sort -V | tail -n 1)"

            if [[ -z "$tag_name" ]]; then
              echo "No release tag found on commit $head_sha" >&2
              exit 1
            fi
          fi

          echo "Resolved tag: $tag_name"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

  build_distribution:
    name: Build Distribution
    needs: resolve_release_tag
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.resolve_release_tag.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build package distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish_to_pypi:
    name: Publish Distribution to PyPI
    needs: build_distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          user: ${{ secrets.PYPI_USERNAME }}
          password: ${{ secrets.PYPI_PASSWORD }}
