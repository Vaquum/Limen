name: Coverage Gate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr_checks_coverage:
    name: PR Checks Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Start SSH agent
        uses: webfactory/ssh-agent@fc49353b67b2b7c1e0e6a600572d01a69f2672dd # v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create SSH tunnel
        run: |
          nohup ssh -N -L 8123:127.0.0.1:8123 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} &

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.10'

      - name: Install limen package (and deps)
        run: |
          pip install coverage
          pip install -e .
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Enforce package coverage floor
        env:
          LIMEN_COVERAGE_RUN: '1'
        run: |
          python -m coverage run -m tests.run
          python -m coverage report --fail-under=92
