name: Automated Release

permissions:
  contents: read

on:
  # Releases are cut manually: dispatch after merging the release prep,
  # never per push, so no two release runs can overlap or queue-drop.
  workflow_dispatch:

concurrency:
  group: automated-release
  cancel-in-progress: false

jobs:
  create_release:
    name: Create Automated Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Fetch all history for git log analysis
          # Credentials stay persisted: create_release.py pushes the tag.
          
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      
      - name: Install GitHub CLI
        run: |
          # GitHub CLI should already be installed in ubuntu-latest
          gh --version

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Create release with Claude
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Install declared release tooling
          pip install --require-hashes -r requirements/ci/release-tools.txt
          pip install --no-deps -e .
          
          # Create the release automation script
          python scripts/create_release.py
