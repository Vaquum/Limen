name: Automated Release

permissions:
  contents: read

on:
  push:
    branches: [main]

jobs:
  create_release:
    name: Create Automated Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Fetch all history for git log analysis
          # Credentials stay persisted: create_release.py pushes the tag.
          
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'
      
      - name: Install GitHub CLI
        run: |
          # GitHub CLI should already be installed in ubuntu-latest
          gh --version

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Create release with Claude
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Install declared release tooling
          pip install --require-hashes -r requirements/ci/release-tools.txt
          pip install --no-deps -e .
          
          # Create the release automation script
          python scripts/create_release.py
