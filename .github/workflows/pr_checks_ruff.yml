name: Ruff Linting

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr_checks_ruff:
    name: PR Checks Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Run ruff linting. The version is pinned to the same release the
      # hashed dev environment installs (requirements/ci/dev-env.txt);
      # without it the action floats to the newest ruff, so a release
      # that stabilises new rules reds every branch at once without a
      # repo change -- 0.16.0 did exactly that on 2026-07-25.
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3.6.1
        with:
          version: 0.15.21
