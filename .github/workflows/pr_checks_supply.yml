name: pr_checks_supply

# Dependency vulnerability gate: declared runtime dependencies must
# carry no known CVE. The deterministic rules live in
# governance/check_dependency_vulnerabilities.py; this workflow only
# runs it. A finding blocks merge unless .github/vuln_exceptions.json
# carries an active, time-boxed exception (id + reason + expiry);
# an expired exception fails again.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr_checks_supply:
    name: pr_checks_supply
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install pip-audit
        run: pip install -c requirements/constraints.txt pip-audit tomli

      - name: Run dependency vulnerability gate
        run: python governance/check_dependency_vulnerabilities.py
