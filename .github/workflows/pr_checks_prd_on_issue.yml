name: pr_checks_prd_on_issue

# Re-run the PRD gate on every open PR that closes an issue when that
# issue's state changes, and heal each such PR's `pr_checks_prd`
# verdict by rerunning the canonical pull_request run when it disagrees
# with the fresh verdict.
#
# Why: `pr_checks_prd` runs on pull_request activity and caches its
# verdict, but rules 3-4 depend on mutable issue state (OPEN, `prd`
# label). A green PR goes stale if its linked issue is subsequently
# closed, reopened, (un)labeled, edited, or deleted: branch protection
# sees only the latest check-run per name per commit SHA and does not
# re-fetch issue state. This workflow closes that gap.
#
# Delivery is rerun-only: this workflow never POSTs check-runs, so no
# API-posted layer exists that could outrank the canonical run and no
# posted-verdict reconciliation is needed.
#
# Two races shape the delivery loop. First, an in-flight canonical run
# may have read the issue BEFORE this event, so its verdict can be
# stale: the loop waits for quiescence (bounded) and only then
# compares the latest completed conclusion against the fresh verdict.
# Second, the rerun request itself can fail transiently: it is
# retried, and only a persistent failure fails this workflow loudly
# instead of silently keeping the stale verdict. A linked PR with no
# canonical run yet (e.g. opened before this workflow existed) is
# left to its next pull_request event.

on:
  issues:
    types: [edited, labeled, unlabeled, closed, reopened, deleted]

concurrency:
  # Keyed per issue, so rapid-fire edits collapse.
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  rerun_prd_gate_for_linked_prs:
    name: pr_checks_prd_on_issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write  # required to rerun the canonical pr_checks_prd run

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.10'

      - name: Find linked PRs
        id: linked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Why scan, not GraphQL: when the issue action is `deleted`
          # the issue node is gone, `repository.issue(number:$num)`
          # returns null, and `closedByPullRequestsReferences` is
          # unreachable. A GraphQL-first path silently finds no PRs
          # for deleted issues -- the very gap this workflow exists
          # to close.
          #
          # Scanning every open PR's body with the SAME closing-keyword
          # regex the gate uses produces the same set of linked PRs
          # the gate would recognise, for every event action including
          # `deleted`. Issues-event runs execute the default branch's
          # code, so the imported parser is the trusted one.
          set -euo pipefail
          REPO="${{ github.repository }}"
          ISSUE_NUM="${{ github.event.issue.number }}"

          gh pr list --repo "$REPO" --state open --base main --limit 1000 \
            --json number,body,headRefOid > open_prs.json

          python3 - "$ISSUE_NUM" <<'PYEOF' > linked_prs.json
          import json, sys
          sys.path.insert(0, "governance")
          from _common import CLOSING_KEYWORD_RE
          target = int(sys.argv[1])
          with open('open_prs.json', encoding='utf-8') as fh:
              prs = json.load(fh)
          linked = []
          for pr in prs:
              body = pr.get('body') or ''
              if any(int(m.group(1)) == target for m in CLOSING_KEYWORD_RE.finditer(body)):
                  linked.append({
                      'number': pr['number'],
                      'headRefOid': pr['headRefOid'],
                  })
          json.dump(linked, sys.stdout)
          PYEOF

          echo "linked PRs:"
          jq -c '.[]' linked_prs.json
          COUNT=$(jq 'length' linked_prs.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Re-run PRD gate per linked PR
        if: steps.linked.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          ISSUE_NUM="${{ github.event.issue.number }}"
          FAILURES=0

          # Process substitution, not a pipe: the loop must export
          # FAILURES to the final check below.
          while IFS= read -r pr; do
            PR_NUM=$(echo "$pr" | jq -r .number)
            HEAD_SHA=$(echo "$pr" | jq -r .headRefOid)
            echo "::group::re-running PRD gate for PR #$PR_NUM @ $HEAD_SHA"

            gh pr view "$PR_NUM" --repo "$REPO" \
              --json title,body,headRefOid,headRefName,headRepository > pr_view.json
            if [ "$(jq -r '.headRefOid' pr_view.json)" != "$HEAD_SHA" ]; then
              echo "PR #$PR_NUM moved after discovery; leave the new head to its own run"
              echo "::endgroup::"
              continue
            fi
            jq -r '.title' pr_view.json > pr_title.txt
            jq -r '.body // ""' pr_view.json > pr_body.txt
            # Branch identity for run lookups below: a head SHA alone
            # is ambiguous across PRs (two branches can share a
            # commit), so canonical runs are matched on branch and
            # repository too -- never by SHA alone.
            HEAD_BRANCH=$(jq -r '.headRefName' pr_view.json)
            HEAD_REPO=$(jq -r '.headRepository.nameWithOwner' pr_view.json)

            # Run the PRD gate; capture output and exit code.
            PR_TITLE=$(cat pr_title.txt)
            set +e
            GATE_OUT=$(python governance/prd_gate.py \
              --pr-title "$PR_TITLE" \
              --pr-body-file pr_body.txt \
              --repo "$REPO" 2>&1)
            GATE_EXIT=$?
            set -e
            echo "$GATE_OUT"
            if [ "$GATE_EXIT" -eq 2 ]; then
              echo "::error::PRD gate setup failed for PR #$PR_NUM; refusing to leave a possibly stale verdict unflagged"
              FAILURES=$((FAILURES + 1))
              echo "::endgroup::"
              continue
            fi
            if [ "$GATE_EXIT" -eq 0 ]; then
              CONCLUSION="success"
            else
              CONCLUSION="failure"
            fi

            # Heal the canonical pull_request run when it disagrees
            # with the fresh verdict. An in-flight run may have read
            # the issue before this event, so skipping on in-flight
            # status alone can strand a stale verdict: wait for
            # quiescence first (bounded), then compare the latest
            # completed conclusion. A moved head aborts the wait and
            # leaves the new head to its own runs.
            QUIET=0
            RUNS="[]"
            for i in $(seq 1 21); do
              RUNS=$(gh api \
                "repos/$REPO/actions/workflows/pr_checks_prd.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
                --jq '.workflow_runs' \
                | jq --arg branch "$HEAD_BRANCH" --arg repo "$HEAD_REPO" \
                  '[.[] | select(.event == "pull_request"
                                 and .head_branch == $branch
                                 and .head_repository.full_name == $repo)]')
              INFLIGHT=$(echo "$RUNS" | jq '[.[] | select(.status != "completed")] | length')
              LIVE_HEAD=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefOid --jq .headRefOid)
              if [ "$LIVE_HEAD" != "$HEAD_SHA" ]; then
                echo "PR #$PR_NUM moved during validation; leave the new head to its own run"
                echo "::endgroup::"
                continue 2
              fi
              if [ "$INFLIGHT" -eq 0 ]; then
                QUIET=1
                break
              fi
              echo "waiting for $INFLIGHT in-flight run(s) to settle ($i/21)..."
              sleep 20
            done
            if [ "$QUIET" -ne 1 ]; then
              echo "::error::runs still in flight for $HEAD_SHA after ~7 minutes; refusing to judge a moving target"
              FAILURES=$((FAILURES + 1))
              echo "::endgroup::"
              continue
            fi
            CANONICAL=$(echo "$RUNS" | jq -c '[.[] | select(.status == "completed")][0] // empty')
            if [ -z "$CANONICAL" ]; then
              echo "::warning::no completed pr_checks_prd run for $HEAD_SHA; leaving verdict to the next pull_request event"
              echo "::endgroup::"
              continue
            fi
            RUN_ID=$(echo "$CANONICAL" | jq -r .id)
            RUN_CONCLUSION=$(echo "$CANONICAL" | jq -r .conclusion)
            if [ "$RUN_CONCLUSION" = "$CONCLUSION" ]; then
              echo "canonical run $RUN_ID already $CONCLUSION"
              echo "::endgroup::"
              continue
            fi

            # The rerun request is retried: a transient API failure
            # must not strand a stale verdict, and every later issue
            # or PR event re-runs this validation anyway.
            RERUN_OK=0
            for attempt in 1 2 3; do
              if gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/rerun" > /dev/null; then
                RERUN_OK=1
                echo "canonical run $RUN_ID rerun requested ($RUN_CONCLUSION -> expected $CONCLUSION, attempt $attempt)"
                break
              fi
              echo "::warning::rerun attempt $attempt for run $RUN_ID failed; retrying"
              sleep 15
            done
            if [ "$RERUN_OK" -ne 1 ]; then
              echo "::error::rerun of canonical run $RUN_ID failed after 3 attempts; verdict for $HEAD_SHA may be stale"
              FAILURES=$((FAILURES + 1))
            fi
            echo "::endgroup::"
          done < <(jq -c '.[]' linked_prs.json)

          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::$FAILURES linked PR(s) could not be revalidated"
            exit 1
          fi
