name: PR Validation

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr_checks_tests:
    name: PR Checks Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_attempt: ${{ steps.artifact_identity.outputs.attempt }}
      runtime_sha256: ${{ steps.artifact_identity.outputs.runtime_sha256 }}
      coverage_sha256: ${{ steps.artifact_identity.outputs.coverage_sha256 }}

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.12'

      - name: Install limen package (and deps)
        run: |
          pip install --require-hashes -r requirements/ci/research-env.txt
          pip install --no-deps -e .

      - name: Verify coverage backend contract
        env:
          LIMEN_COVERAGE_RUN: '1'
          COVERAGE_CORE: sysmon
        run: python -m pytest -q governance/tests/test_tests_ci_contract.py

      - name: Run limen tests with coverage
        env:
          LIMEN_COVERAGE_RUN: '1'
          COVERAGE_CORE: sysmon
        run: |
          set -euxo pipefail
          mkdir -p coverage-artifacts
          python - <<'PY'
          import coverage
          import sys
          measurement = coverage.Coverage()
          measurement.start()
          active = sys.monitoring.get_tool(sys.monitoring.COVERAGE_ID) == 'coverage.py'
          measurement.stop()
          if not active:
              raise SystemExit('SysMonitor coverage is not active')
          PY
          test_exit=0
          python -m coverage run -m tests.run || test_exit=$?
          if [ -f .coverage ]; then
            python -m coverage report
            mv .coverage coverage-artifacts/coverage.db
          fi
          exit $test_exit

      - name: Publish runtime summary
        if: ${{ always() && hashFiles('coverage-artifacts/test_runtime_profile.json') != '' }}
        run: |
          python -m tests.runtime_gate \
            --profile coverage-artifacts/test_runtime_profile.json \
            --budget tests/runtime_budget.json \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Record validation artifact identity
        id: artifact_identity
        if: ${{ always() }}
        run: |
          set -euo pipefail
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          for artifact in runtime:test_runtime_profile.json coverage:coverage.db; do
            file="coverage-artifacts/${artifact#*:}"
            if [ -f "$file" ]; then
              echo "${artifact%%:*}_sha256=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Upload coverage artifact
        if: ${{ always() && hashFiles('coverage-artifacts/coverage.db') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-data-attempt-${{ github.run_attempt }}
          path: coverage-artifacts/coverage.db

      - name: Upload runtime artifact
        if: ${{ always() && hashFiles('coverage-artifacts/test_runtime_profile.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-runtime-profile-attempt-${{ github.run_attempt }}
          path: coverage-artifacts/test_runtime_profile.json

  pr_checks_runtime:
    name: PR Checks Runtime
    if: ${{ always() }}
    needs: pr_checks_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.10'

      - name: Require runtime artifact identity
        if: ${{ needs.pr_checks_tests.result == 'success' }}
        env:
          ARTIFACT_ATTEMPT: ${{ needs.pr_checks_tests.outputs.artifact_attempt }}
          EXPECTED_SHA256: ${{ needs.pr_checks_tests.outputs.runtime_sha256 }}
        run: |
          test -n "$ARTIFACT_ATTEMPT"
          test -n "$EXPECTED_SHA256"

      - name: Download runtime artifact
        if: ${{ needs.pr_checks_tests.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: test-runtime-profile-attempt-${{ needs.pr_checks_tests.outputs.artifact_attempt }}
          path: coverage-artifacts

      - name: Verify runtime artifact identity
        if: ${{ needs.pr_checks_tests.result == 'success' }}
        env:
          EXPECTED_SHA256: ${{ needs.pr_checks_tests.outputs.runtime_sha256 }}
        run: printf '%s  %s\n' "$EXPECTED_SHA256" coverage-artifacts/test_runtime_profile.json | sha256sum --check --strict

      - name: Skip runtime enforcement after upstream failure
        if: ${{ needs.pr_checks_tests.result != 'success' }}
        run: |
          {
            echo "## Test Runtime"
            echo
            echo "Skipped runtime enforcement because \`PR Checks Tests\` did not succeed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce suite runtime budget
        if: ${{ needs.pr_checks_tests.result == 'success' }}
        run: |
          python -m tests.runtime_gate \
            --profile coverage-artifacts/test_runtime_profile.json \
            --budget tests/runtime_budget.json \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --enforce

  pr_checks_coverage:
    name: PR Checks Coverage
    needs: pr_checks_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
        with:
          python-version: '3.10'

      - name: Install coverage
        run: pip install --require-hashes -r requirements/ci/coverage-tools.txt

      - name: Require coverage artifact identity
        env:
          ARTIFACT_ATTEMPT: ${{ needs.pr_checks_tests.outputs.artifact_attempt }}
          EXPECTED_SHA256: ${{ needs.pr_checks_tests.outputs.coverage_sha256 }}
        run: |
          test -n "$ARTIFACT_ATTEMPT"
          test -n "$EXPECTED_SHA256"

      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-data-attempt-${{ needs.pr_checks_tests.outputs.artifact_attempt }}
          path: coverage-artifacts

      - name: Verify coverage artifact identity
        env:
          EXPECTED_SHA256: ${{ needs.pr_checks_tests.outputs.coverage_sha256 }}
        run: printf '%s  %s\n' "$EXPECTED_SHA256" coverage-artifacts/coverage.db | sha256sum --check --strict

      - name: Restore coverage data
        run: mv coverage-artifacts/coverage.db .coverage

      - name: Enforce package coverage floor
        run: python -m coverage report --fail-under=92

  publish_coverage_pr_comment:
    name: Publish Coverage Comment
    if: github.event_name == 'pull_request' && always()
    needs: pr_checks_tests
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Download coverage artifact
        if: ${{ needs.pr_checks_tests.outputs.artifact_attempt != '' && needs.pr_checks_tests.outputs.coverage_sha256 != '' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-data-attempt-${{ needs.pr_checks_tests.outputs.artifact_attempt }}
          path: coverage-artifacts

      - name: Check coverage artifact presence
        id: coverage_artifact
        env:
          EXPECTED_SHA256: ${{ needs.pr_checks_tests.outputs.coverage_sha256 }}
        run: |
          if [ -f coverage-artifacts/coverage.db ]; then
            test -n "$EXPECTED_SHA256"
            printf '%s  %s\n' "$EXPECTED_SHA256" coverage-artifacts/coverage.db | sha256sum --check --strict
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore coverage data
        if: steps.coverage_artifact.outputs.available == 'true'
        run: mv coverage-artifacts/coverage.db .coverage

      - name: Publish coverage comment
        if: steps.coverage_artifact.outputs.available == 'true'
        uses: py-cov-action/python-coverage-comment-action@63f52f4fbbffada6e8dee8ec432de7e01df9ba79 # v3.41
        with:
          GITHUB_TOKEN: ${{ github.token }}
