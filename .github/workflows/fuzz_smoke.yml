name: AVX-512 flag probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Obtain pinned public compiler and native Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/wheels
          cd bundle
          for part in rustc rust-std; do
            file="${part}-1.89.0-x86_64-unknown-linux-gnu.tar.xz"
            curl -fL --retry 3 "https://static.rust-lang.org/dist/$file" -o "$file"
            curl -fL --retry 3 "https://static.rust-lang.org/dist/$file.sha256" -o "$file.sha256"
            sha256sum -c "$file.sha256"
          done
          python -m pip download -d wheels --only-binary=:all: 'polars==1.42.1' 'pyarrow==23.0.1' 'pandas==2.3.3'
          curl -fL https://api.github.com/repos/Vaquum/Limen/tarball/44eff3b244c80ce8473845bd60b074b3682fe441 -o limen-source.tar.gz
          tar xzf limen-source.tar.gz
          python -m pip wheel --no-deps --wheel-dir wheels ./Vaquum-Limen-*
          sha256sum wheels/* > wheel-sha256.txt
          lscpu > build-host.txt
      - uses: actions/upload-artifact@v4
        with:
          name: terasweep-offline-rust-and-limen
          path: bundle/
          retention-days: 3
          compression-level: 0
