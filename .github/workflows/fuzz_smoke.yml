name: Fuzz Smoke

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  fuzz_smoke:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install limen package and fuzzing engine
        run: |
          pip install --require-hashes -r requirements/ci/runtime-env.txt
          pip install --require-hashes -r requirements/ci/fuzz-tools.txt
          pip install --no-deps -e .

      - name: Fuzz the manifest surfaces
        run: python fuzz/fuzz_yaml_manifest.py -max_total_time=60 -max_len=4096 -timeout=30 -rss_limit_mb=2560
