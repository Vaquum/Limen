name: AVX-512 flag probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download public compiler and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline/wheels
          cd offline
          for component in rustc rust-std; do
            file="$component-1.89.0-x86_64-unknown-linux-gnu.tar.xz"
            curl --fail --location --retry 3 "https://static.rust-lang.org/dist/$file" -o "$file"
            curl --fail --location --retry 3 "https://static.rust-lang.org/dist/$file.sha256" -o "$file.sha256"
            sha256sum -c "$file.sha256"
          done
          python -m pip download --only-binary=:all: --dest wheels polars==1.42.1 pyarrow==22.0.0 pandas==2.3.3
          curl --fail --location --retry 3 https://api.github.com/repos/Vaquum/Limen/tarball/44eff3b244c80ce8473845bd60b074b3682fe441 -o limen-44eff3b2.tar.gz
          sha256sum *.tar.* wheels/* > CHECKSUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: terasweep-offline-public-toolchain
          path: offline/
          retention-days: 1
          compression-level: 0
