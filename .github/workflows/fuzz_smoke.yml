name: Fuzz Smoke

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  fuzz_smoke:
    name: Fuzz Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.10'

      - name: Install limen package and fuzzing engine
        run: |
          pip install --require-hashes -r requirements/ci/runtime-env.txt
          pip install --require-hashes -r requirements/ci/fuzz-tools.txt
          pip install --no-deps -e .

      - name: Fuzz the manifest surfaces
        run: python fuzz/fuzz_yaml_manifest.py -max_total_time=60 -max_len=4096 -timeout=30 -rss_limit_mb=2560
