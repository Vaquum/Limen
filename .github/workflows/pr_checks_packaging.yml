name: Packaging Checks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr_checks_packaging:
    name: PR Checks Packaging
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install packaging tools
        run: |
          python -m pip install --require-hashes -r requirements/ci/dev-env.txt
          python -m pip install --no-deps -e .

      - name: Audit package source contract
        run: python scripts/package_audit.py

      - name: Build distributions twice
        env:
          SOURCE_DATE_EPOCH: '1704067200'
        run: |
          python -m build --outdir dist-a
          python -m build --outdir dist-b

      - name: Verify reproducible artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          for first in sorted(Path('dist-a').iterdir()):
              second = Path('dist-b', first.name)
              assert second.exists(), f'missing second artifact: {first.name}'
              assert hashlib.sha256(first.read_bytes()).hexdigest() == hashlib.sha256(second.read_bytes()).hexdigest(), first.name
          PY

      - name: Inspect package artifacts
        run: |
          python scripts/package_audit.py --dist-dir dist-a
          python -m twine check dist-a/*
          check-wheel-contents dist-a/*.whl
          check-manifest
          pyroma .

      - name: Generate dependency reports
        run: |
          python -m pip install --require-hashes -r requirements/ci/research-env.txt
          python -m pip install --no-deps -e .
          pip-licenses --format=json --output-file dependency-licenses.json
          cyclonedx-py environment --output-file sbom.json

      - name: Upload dependency reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-reports
          path: |
            dependency-licenses.json
            sbom.json

  pr_checks_package_install:
    name: PR Checks Package Install (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        env:
          SOURCE_DATE_EPOCH: '1704067200'
        run: |
          python -m pip install --require-hashes -r requirements/ci/build-tools.txt
          python -m build --wheel --outdir dist

      - name: Install and smoke test base wheel
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import sys
          import limen
          from importlib import metadata

          assert limen.__version__ == metadata.version('vaquum-limen')
          for name in ('lightgbm', 'pyarrow', 'scipy', 'statsmodels', 'talib', 'tabpfn', 'xgboost'):
              assert name not in sys.modules, name
          PY
          python -m limen --version
          limen --version
          python -m pip check
