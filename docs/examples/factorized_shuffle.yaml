schema_version: '1.0'
metadata:
  name: factorized_shuffle
  description: Bounded seeded factorized traversal over recorded hourly observations
  limen_version: "6.0.0"
  mode: development
sfd:
  manifest:
    type: ml
    data_source:
      method: limen.data.HistoricalData.get_any_file
      params:
        file_path_or_url: tests/fixtures/spot_1h_20240101_20241231.parquet
        row_count_limit: 192
    split_dates:
      train_start: '2024-12-25'
      train_end: '2024-12-28'
      val_start: '2024-12-28'
      val_end: '2024-12-29'
      test_start: '2024-12-29'
      test_end: '2024-12-31'
      test_predict_guard: false
    indicators:
    - func: limen.indicators.window_return
      params:
        period: 1
    features:
    - func: limen.features.lag_range
      params:
        col: ret_1
        start: 0
        end: '{lookback}'
    target:
      name: up_next
      class: limen.targets.QuantileBinaryTarget
      fit_params:
        source_column: ret_1
        quantile: '{quantile}'
      transform_params:
        shift: -1
    scaler:
      class: limen.scalers.RobustScaler
    reference_architecture: limen.sfd.reference_architecture.lightgbm_binary
    backtest:
      fee_bps: '{fee}'
      slip_bps: 3.0
      notional_rate: 0.5
  params:
    lookback:
    - 2
    - 4
    quantile:
    - 0.5
    fee:
    - 4.0
    - 9.0
    n_estimators:
    - 4
    - 8
    n_jobs:
    - 1
    random_state:
    - 42
    deterministic:
    - true
    force_row_wise:
    - true
    early_stopping_rounds:
    - 0
    subsample_freq:
    - 0
    subsample:
    - 1.0
    colsample_bytree:
    - 1.0
uel:
  recording:
    predictions: true
    alignment: true
    trade_ledger: true
    fold_details: true
  n_permutations: 8
  prep_each_round: true
  search_strategy:
    type: grid
    shuffle: true
    seed: 42
  record_execution: true
  record_model_outputs: true
  factorize: true
  checkpoint_interval: 1
  feedback_interval: 1
  output_path: factorized_shuffle
