schema_version: '1.0'
metadata:
  name: book_helper-features
  mode: development
sfd:
  manifest:
    type: ml
    data_source:
      method: limen.data.HistoricalData.get_any_file
      params:
        file_path_or_url: inputs/spot_1h_20240101_20241231.parquet
    split_dates:
      train_start: '2024-01-01'
      train_end: '2024-07-01'
      val_start: '2024-07-01'
      val_end: '2024-10-01'
      test_start: '2024-10-01'
      test_end: '2025-01-01'
    indicators:
    - func: limen.indicators.roc
      params:
        period: 1
        group: base
    - func: limen.indicators.returns
      params:
        group: base
    - func: limen.indicators.rolling_volatility
      params:
        column: returns
        window: 12
        group: base
    - func: limen.indicators.bollinger_bands
      params:
        group: base
    target:
      name: label
      class: limen.targets.NextBarUpTarget
    scaler:
      from_params: scaler_type
    reference_architecture: limen.sfd.reference_architecture.logreg_binary
    features:
    - func: limen.features.absorption_intensity
      params:
        group: absorption_intensity
    - func: limen.features.amihud_illiquidity
      params:
        group: amihud_illiquidity
    - func: limen.features.atr_percent_sma
      params:
        group: atr_percent_sma
    - func: limen.features.atr_sma
      params:
        group: atr_sma
    - func: limen.features.body_to_range
      params:
        group: body_to_range
    - func: limen.features.bulk_volume_classification
      params:
        group: bulk_volume_classification
    - func: limen.features.calendar_time_features
      params:
        group: calendar_time_features
    - func: limen.features.close_ma_distance_atr
      params:
        group: close_ma_distance_atr
    - func: limen.features.close_position
      params:
        group: close_position
    - func: limen.features.close_position_rolling
      params:
        group: close_position_rolling
    - func: limen.features.close_to_extremes
      params:
        group: close_to_extremes
    - func: limen.features.cusum_filter
      params:
        group: cusum_filter
    - func: limen.features.cyclical_time_features
      params:
        group: cyclical_time_features
    - func: limen.features.distance_from_high
      params:
        group: distance_from_high
    - func: limen.features.distance_from_low
      params:
        group: distance_from_low
    - func: limen.features.distance_from_ma
      params:
        group: distance_from_ma
    - func: limen.features.dollar_bar_crash_reversal
      params:
        momentum_threshold_bps: 50.0
        flow_z_threshold: 1.0
        hold_minutes: 60
        group: dollar_bar_crash_reversal
    - func: limen.features.dollar_volume
      params:
        group: dollar_volume
    - func: limen.features.downside_volatility_ratio
      params:
        group: downside_volatility_ratio
    - func: limen.features.ema_alignment
      params:
        group: ema_alignment
    - func: limen.features.fractional_diff
      params:
        d: 0.4
        cols:
        - close
        threshold: 0.05
        group: fractional_diff
    - func: limen.features.gap_high
      params:
        group: gap_high
    - func: limen.features.garman_klass_volatility
