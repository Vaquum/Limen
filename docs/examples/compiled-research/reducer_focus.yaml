# region declaration
schema_version: '1.0'
metadata:
  name: book_reducer_focus
  mode: development
sfd:
  manifest:
    type: ml
    data_source:
      method: limen.data.HistoricalData.get_any_file
      params:
        file_path_or_url: inputs/spot_1h_20240101_20241231.parquet
    split_dates:
      train_start: '2024-01-01'
      train_end: '2024-01-15'
      val_start: '2024-01-15'
      val_end: '2024-01-18'
      test_start: '2024-01-18'
      test_end: '2024-01-22'
    indicators:
    - func: limen.indicators.roc
      params:
        period: 1
        group: momentum
    target:
      name: quantile_flag
      class: limen.targets.QuantileBinaryTarget
      fit_params:
        source_column: roc_1
        quantile: 0.5
      transform_params:
        shift: -1
    backtest:
      fee_bps: 7.0
      slip_bps: 3.0
      notional_rate: 0.5
    scaler:
      from_params: scaler_type
    reference_architecture: limen.sfd.reference_architecture.logreg_binary
  params:
    scaler_type:
    - logreg
    C:
    - 0.1
    - 0.5
    - 1.0
    - 2.0
    random_state:
    - 40
    - 41
    - 42
uel:
  output_path: compiled-reducer-focus
  n_permutations: 12
  search_strategy:
    type: grid
  output_format: csv
  checkpoint_interval: 1
  pruning_strategies:
  - type: focus
    params:
      metric: accuracy
      breakthrough_threshold: 0.0
      min_observations: 2
      focus_timeout: 2
      variation_count: 3
  feedback_interval: 2
# endregion declaration
