schema_version: '1.0'
metadata:
  name: book_compiled_ml_allocation
  mode: development
sfd:
  manifest:
    type: ml
    data_source:
      method: limen.data.HistoricalData.get_any_file
      params:
        file_path_or_url: inputs/spot_1h_20240101_20241231.parquet
    split_dates:
      train_start: '2024-01-02'
      train_end: '2024-01-15'
      val_start: '2024-01-15'
      val_end: '2024-01-17'
      test_start: '2024-01-17'
      test_end: '2024-01-19'
    backtest:
      product:
        kind: cash_spot
        instrument: BTCUSDT
        base_currency: BTC
        quote_currency: USDT
        quantity_step: 1e-05
        min_notional: 5
      source_interval_seconds: 3600
      fee_bps: 0
      slip_bps: 0
      take_profit_bps_column: volatility_take_profit_bps
      stop_loss_bps_column: volatility_stop_loss_bps
      barrier_features:
        method: limen.features.volatility_barriers.volatility_barriers
        params:
          span: '{risk_span}'
          regime_span: 24
          min_periods: 3
      prediction_mode: target_exposure
      max_holding_seconds: 7200
    reference_architecture: 
      limen.sfd.reference_architecture.logreg_binary.logreg_binary
    allocation:
      method: limen.sfd.reference_architecture.meta_allocation.meta_allocation
      params:
        folds: 3
        min_train_samples: 2
        features:
        - open
        - close
        probability_threshold: 0.1
        max_size: 0.8
        risk_budget_fraction: 0.002
        include_primary_proba: true
    indicators:
    - func: limen.indicators.window_return
      params:
        period: 1
    target:
      name: forward
      class: limen.targets.QuantileBinaryTarget
      fit_params:
        source_column: ret_1
        quantile: 0.5
      transform_params:
        shift: -1
    scaler:
      class: limen.scalers.RobustScaler
  params:
    risk_span:
    - 6
    - 12
    C:
    - 1.0
    max_iter:
    - 1000
uel:
  n_permutations: 2
  search_strategy:
    type: grid
  output_format: csv
  checkpoint_interval: 1
  prep_each_round: true
  recording:
    predictions: true
    alignment: true
    trade_ledger: true
    fold_details: true
